name: Cleanup 2026 Autumn Preview

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Mark Preview deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          deployments=$(gh api \
            --method GET \
            "/repos/${{ github.repository }}/deployments?environment=preview&per_page=100" \
            --jq '.[] | select(.description == "Preview for Pull Request #'${PR_NUMBER}'") | .id')

          if [ -z "$deployments" ]; then
            echo "No Preview deployments found for Pull Request #${PR_NUMBER}."
            exit 0
          fi

          for deployment_id in $deployments; do
            echo "Marking Preview deployment $deployment_id as inactive"

            gh api \
              --method POST \
              "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
              -f state="inactive" \
              -f description="Pull Request #${PR_NUMBER} was closed." \
              -f auto_inactive=false
          done