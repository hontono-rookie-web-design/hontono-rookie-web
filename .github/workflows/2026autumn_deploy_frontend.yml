name: Deploy 2026 Autumn Frontend - Production

on:
  push:
    branches: [main]
    paths:
      - "2026autumn/frontend/**"

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production
      url: https://2026autumn.hontono-rookie-web.workers.dev/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "2026autumn/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "2026autumn/frontend"

      - name: Deploy to Cloudflare Production
        run: npm run deploy
        working-directory: "2026autumn/frontend"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mark previous Production deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          deployments=$(gh api \
            --method GET \
            "/repos/${{ github.repository }}/deployments?environment=production&per_page=100" \
            --jq '.[] | select(.sha != "'$CURRENT_SHA'") | .id')

          for deployment_id in $deployments; do
            echo "Marking Production deployment $deployment_id as inactive"

            gh api \
              --method POST \
              "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
              -f state="inactive" \
              -f description="Superseded by a newer Production deployment." \
              -f auto_inactive=false
          done