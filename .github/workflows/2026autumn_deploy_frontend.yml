name: 2026autumn Deploy - Production

on:
  push:
    branches:
      - main
    paths:
      - "2026autumn/frontend/**"

  # GitHub Actionsから手動でProductionへデプロイ
  workflow_dispatch:

  # ページはビルド時に静的生成しているため、
  # スプレッドシートの更新を反映するために10分おきに確認し、
  # 前回デプロイ時から変わっていたときだけ再デプロイする
  # （毎時0分はActionsが混み合い遅延しやすいので5分ずらす）
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"

  # スプレッドシートを更新するワークフローが終わったら、すぐに反映する
  workflow_run:
    workflows:
      - "2026autumn Fetch Videos"
      - "2026autumn Group Daily Aggregation"
      - "2026autumn Fetch Derivative"
      - "2026autumn Fetch Note"
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  # スプレッドシートとフェーズの内容からハッシュを計算し、
  # 前回デプロイ時から変わっているかを確認する
  check-sheets:
    name: Check spreadsheet changes
    # workflow_runの場合は、元のワークフローが成功したときだけ実行する
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      changed: ${{ steps.cache.outputs.cache-hit != 'true' }}

    steps:
      - name: Compute spreadsheet hash
        id: hash
        env:
          SPREADSHEET_IDS: >-
            ${{ secrets.SPREADSHEET_ID_DERIVATIVE }}
            ${{ secrets.SPREADSHEET_ID_NOTES }}
            ${{ secrets.SPREADSHEET_ID_VIDEOS }}
            ${{ secrets.SPREADSHEET_ID_VOTEFORM }}
          EVENT_PHASE: ${{ vars.EVENT_PHASE }}
          EVENT_PHASE_SP: ${{ vars.EVENT_PHASE_SP }}
        run: |
          mkdir -p sheets
          i=0
          for id in $SPREADSHEET_IDS; do
            i=$((i + 1))
            # 取得に失敗した場合は、空のデータでデプロイしないようにここで止める
            curl -sSfL --retry 3 --retry-delay 5 "https://opensheet.elk.sh/${id}/1" -o "sheets/${i}.json"
            if ! jq -e 'type == "array"' "sheets/${i}.json" > /dev/null; then
              echo "::error::Spreadsheet ${i} returned unexpected data."
              exit 1
            fi
          done

          # フェーズの切り替えも反映できるようにハッシュに含める
          printf '%s\n%s\n' "$EVENT_PHASE" "$EVENT_PHASE_SP" > sheets/phase.txt

          hash=$(cat sheets/*.json sheets/phase.txt | sha256sum | cut -d ' ' -f 1)
          echo "$hash" > sheet-hash.txt
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Spreadsheet hash: $hash"

      # 同じハッシュでデプロイ済みならキャッシュが存在する（中身はダウンロードしない）
      - name: Check previous deployment
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: sheet-hash.txt
          key: 2026autumn-sheets-${{ steps.hash.outputs.hash }}
          lookup-only: true

      - name: Show result
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "No spreadsheet changes since the last deployment."
          else
            echo "Spreadsheet changes detected."
          fi

  deploy:
    needs: check-sheets
    # 定期実行ではスプレッドシートが変わったときだけデプロイする
    # （push・手動実行・workflow_runでは常にデプロイする）
    if: github.event_name != 'schedule' || needs.check-sheets.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Productionへのデプロイが同時に複数実行されないようにする
    # ワークフロー全体ではなくこのジョブに設定することで、
    # 変更がなくデプロイしない定期実行が、待機中のpushのデプロイを置き換えないようにする
    concurrency:
      group: 2026autumn-production
      cancel-in-progress: false

    # GitHub上では開催期ごとにEnvironmentを分けて管理する
    environment:
      name: 2026autumn-production
      url: https://2026autumn.hontono-rookie-web.workers.dev/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # リポジトリをチェックアウトしたあとに
          # トークンなどの認証情報をGitのconfigに残さない
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "2026autumn/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "2026autumn/frontend"

      - name: Create .env.production
        working-directory: "2026autumn/frontend"
        run: |
          echo "EVENT_PHASE=${{ vars.EVENT_PHASE }}" >> .env.production
          echo "EVENT_PHASE_SP=${{ vars.EVENT_PHASE_SP }}" >> .env.production
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}" >> .env.production
          echo "SPREADSHEET_ID_DERIVATIVE=${{ secrets.SPREADSHEET_ID_DERIVATIVE }}" >> .env.production
          echo "SPREADSHEET_ID_NOTES=${{ secrets.SPREADSHEET_ID_NOTES }}" >> .env.production
          echo "SPREADSHEET_ID_VIDEOS=${{ secrets.SPREADSHEET_ID_VIDEOS }}" >> .env.production
          echo "SPREADSHEET_ID_VOTEFORM=${{ secrets.SPREADSHEET_ID_VOTEFORM }}" >> .env.production

      # CloudflareのProductionへデプロイ
      - name: Deploy to Cloudflare Production
        run: npm run deploy
        working-directory: "2026autumn/frontend"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # デプロイしたときのハッシュを記録し、次回の定期実行で比較する
      - name: Save spreadsheet hash
        if: needs.check-sheets.outputs.changed == 'true'
        run: echo "${{ needs.check-sheets.outputs.hash }}" > sheet-hash.txt

      - name: Record deployed spreadsheet hash
        if: needs.check-sheets.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: sheet-hash.txt
          key: 2026autumn-sheets-${{ needs.check-sheets.outputs.hash }}

  # Productionへのデプロイ成功後、
  # 最新以外のGitHub Deploymentをinactiveにする
  cleanup-deployments:
    name: Cleanup previous Production deployments
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mark previous Production deployments inactive
        # GitHub上のDeployment整理に失敗しても、
        # CloudflareへのProductionデプロイ自体は失敗扱いにしない
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          deployments=$(gh api graphql \
            -F owner="${{ github.repository_owner }}" \
            -F name="${{ github.event.repository.name }}" \
            -f query='
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  deployments(
                    first: 100
                    environments: ["2026autumn-production"]
                    orderBy: {
                      field: CREATED_AT
                      direction: DESC
                    }
                  ) {
                    nodes {
                      databaseId
                      state
                      createdAt
                    }
                  }
                }
              }
            ')

          latest_deployment_id=$(echo "$deployments" | \
            jq -r '.data.repository.deployments.nodes[0].databaseId // empty')

          if [ -z "$latest_deployment_id" ]; then
            echo "No Production deployments found."
            exit 0
          fi

          echo "Latest Production deployment: $latest_deployment_id"

          # 最新Deployment以外から、
          # inactiveにする必要があるDeploymentをすべて取得する
          #
          # INACTIVE / DESTROYED はすでに無効化されているため除外する
          # PENDING / QUEUED / IN_PROGRESS / WAITING は
          # 実行中の可能性があるため対象にしない
          previous_deployments=$(echo "$deployments" | \
            jq -r '
              .data.repository.deployments.nodes[1:][]
              | select(
                  .state == "ACTIVE"
                  or .state == "SUCCESS"
                  or .state == "FAILURE"
                  or .state == "ERROR"
                  or .state == "ABANDONED"
                )
              | .databaseId
            ')

          if [ -z "$previous_deployments" ]; then
            echo "No previous Production deployments to deactivate."
            exit 0
          fi

          for deployment_id in $previous_deployments; do
            echo "Marking Production deployment $deployment_id as inactive"

            success=false

            for attempt in 1 2 3; do
              if gh api \
                --method POST \
                "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
                -f state="inactive" \
                -f description="Superseded by a newer Production deployment." \
                -F auto_inactive=false; then

                success=true
                break
              fi

              echo "Attempt $attempt failed for deployment $deployment_id."

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done

            if [ "$success" != "true" ]; then
              echo "::warning::Failed to mark deployment $deployment_id as inactive after 3 attempts."
            fi

            # GitHub APIへ短時間に連続して書き込まないよう間隔を空ける
            sleep 2
          done
