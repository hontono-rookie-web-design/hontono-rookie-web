name: Deploy 2026 Autumn Frontend - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "2026autumn/frontend/**"

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}-2026autumn.hontono-rookie-web.workers.dev/

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # リポジトリをチェックアウトしたあとにトークンなどの認証情報を Git の config に残さない
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "2026autumn/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "2026autumn/frontend"

      - name: Deploy to Cloudflare Preview
        run: npm run upload -- --preview-alias "pr-${{ github.event.pull_request.number }}"
        working-directory: "2026autumn/frontend"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}