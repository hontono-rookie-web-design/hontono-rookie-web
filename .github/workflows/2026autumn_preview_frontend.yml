name: Deploy 2026 Autumn Frontend - Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "2026autumn/frontend/**"

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "2026autumn/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: "2026autumn/frontend"

      - name: Create GitHub Preview deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments" \
            -f ref="${{ github.ref }}" \
            -f environment="preview" \
            -f description="Preview for Pull Request #${{ github.event.pull_request.number }}" \
            -F transient_environment=true \
            -F production_environment=false \
            --input - <<'EOF' \
            | jq -r '.id'
          {
            "required_contexts": [],
            "auto_merge": false
          }
          EOF
          
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="in_progress" \
            -f description="Deploying Preview to Cloudflare."

      - name: Deploy to Cloudflare Preview
        run: npm run upload -- --preview-alias "pr-${{ github.event.pull_request.number }}"
        working-directory: "2026autumn/frontend"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mark deployment successful
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-2026autumn.hontono-rookie-web.workers.dev/
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="success" \
            -f description="Preview deployment completed successfully." \
            -f environment_url="$PREVIEW_URL" \
            -f auto_inactive=false