name: 2026autumn Group Daily Aggregation

on:
  workflow_dispatch: # 手動実行
  schedule:
    # JST 午前0:00 = UTC 前日 15:00（毎日実行）
    - cron: '0 15 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      GOOGLE_APPLICATION_CREDENTIALS: credentials.json
      APP_ENV: production

    defaults:
      run:
        working-directory: 2026autumn/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run script
        run: |
          python -m scripts.group_daily_aggregation
